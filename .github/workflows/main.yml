name: Generate Stats Images

on:
  push:
    branches: 
      - master
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2 tag
      with:
        version: 0.16.0

    - name: Build
      run: |
        zig build

    - name: Checkout history branch
      run: |
        git config --global user.name "jstrieb/github-stats"
        git config --global user.email "github-stats[bot]@jstrieb.github.io"
        # Push generated files to the generated branch
        git pull
        git checkout generated || git checkout -b generated

    - name: Generate images
      run: |
        # Проверяем, что переменная EXCLUDE_ALL_FORKS задана и равна true (в любом регистре)
        if [[ "${EXCLUDE_ALL_FORKS,,}" == "true" ]]; then
          # 1. Собираем сырой список всех репозиториев во временный файл
          ./zig-out/bin/github-stats --json-output-file /tmp/stats.json
          # 2. Выбираем все репозитории, которые НЕ начинаются с "Lifailon/"
          FOREIGN_REPOS=$(jq -r '[.repositories[].name | select(startswith("Lifailon/") | not)] | join(",")' /tmp/stats.json)
          # 3. Объединяем исключения из секретов с найденными чужими репозиториями
          if [ -n "$EXCLUDE_REPOS" ] && [ -n "$FOREIGN_REPOS" ]; then
            export EXCLUDE_REPOS="$EXCLUDE_REPOS,$FOREIGN_REPOS"
          elif [ -n "$FOREIGN_REPOS" ]; then
            export EXCLUDE_REPOS="$FOREIGN_REPOS"
          fi
        fi
        # 4. Генерируем итоговые SVG
        ./zig-out/bin/github-stats
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
        EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
        EXCLUDE_ALL_FORKS: ${{ secrets.EXCLUDE_ALL_FORKS }}
        EXCLUDE_PRIVATE: "false"
        SILENT: "true"
        # TODO: Remove this when they get their API working again
        # https://github.com/orgs/community/discussions/192970
        MAX_RETRIES: 5

    - name: Commit to the repo
      run: |
        git add .
        # Force the build to succeed, even if no files were changed
        git commit -m 'Update generated files' || true
        git push --set-upstream origin generated
